# Cloud screenshot capture (manual trigger only).
# The screenshot never leaves the runner unencrypted: it is encrypted to the
# recipient certificate in .capture/ and pushed to a short-lived branch
# capture-out/<epoch>-<run_id>. Only the holder of the private key can open it.
# The caller deletes the branch right after delivery; cleanup.yml removes any
# leftovers older than 24 hours.
name: capture
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL to capture"
        required: false
        default: "https://example.com"
permissions:
  contents: write
  actions: read
concurrency:
  group: capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .capture
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright (uses the runner's preinstalled Google Chrome)
        working-directory: .capture
        run: |
          echo '{"name":"capture","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund playwright-core@1.47.2 >/dev/null || { echo "::error::npm install failed"; exit 1; }
          command -v google-chrome >/dev/null || { echo "::error::google-chrome not found on runner"; exit 1; }
      - name: Capture
        working-directory: .capture
        env:
          TARGET_URL: ${{ inputs.url }}
        run: node capture.mjs
      - name: Encrypt and push to a short-lived branch
        if: always()
        working-directory: .capture
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          [ -d out ] || { echo "::error::no output"; exit 1; }
          tar -C out -czf /tmp/capture.tgz .
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in /tmp/capture.tgz -out /tmp/capture.p7m recipient.cert.pem
          rm -rf out /tmp/capture.tgz
          BR="capture-out/$(date +%s)-${RUN_ID}"
          mkdir /tmp/pub && cd /tmp/pub
          git init -q -b "$BR"
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          cp /tmp/capture.p7m .
          git add capture.p7m
          git commit -q -m "encrypted capture ${RUN_ID}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BR"
          echo "::notice::BRANCH=$BR"
